<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعدادات ميزان — الهاتف، تيليغرام › حدود اليوم</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Readex+Pro:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div dir="rtl" style="{{vars}} --tone: var(--sky); width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--tx); font-family: Inter, 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px">

  <a href="Mobile.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 10px; border-radius: 12px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--mu)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    الإعدادات
  </a>

  <div style="display: flex; align-items: center; gap: 12px">
    <span style="width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--tone); background: color-mix(in srgb, var(--tone) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 30%, transparent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4z"></path></svg></span>
    <div style="flex: 1; min-width: 0"><h1 style="margin: 0; font-family: 'Readex Pro', 'IBM Plex Sans Arabic', sans-serif; font-size: 20px; font-weight: 700">تيليغرام</h1><p style="margin: 0; font-size: 12.5px; color: var(--mu)">التنبيهات على هاتفك</p></div>
    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--tone)"></span>متصل</span>
  </div>

  <!-- Level 2: topics, scroll sideways -->
  <div role="tablist" aria-label="مواضيع تيليغرام" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; white-space: nowrap">
    <button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bd); background: transparent; color: var(--mu); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">الربط</button>
    <button type="button" role="tab" aria-selected="true" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--pr); background: var(--pr); color: var(--op); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">حدود اليوم</button>
    <button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bd); background: transparent; color: var(--mu); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">التنبيهات</button>
    <button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bd); background: transparent; color: var(--mu); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">الأخبار والملخصات</button>
    <button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bd); background: transparent; color: var(--mu); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">الهدوء</button>
  </div>

  <p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--tone) 8%, var(--sf)); font-size: 13px; line-height: 1.6"><span style="display: flex; color: var(--tone); padding-top: 2px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span><span>ضع حدّاً لخسارتك ولعدد صفقاتك في اليوم. يُنبّهك البوت قبل أن تتجاوزه.</span></p>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--bd); background: var(--sf)">
    <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-weight: 600">حد الخسارة اليومي</span><button type="button" role="switch" aria-checked="true" aria-label="حد الخسارة اليومي" style="width: 42px; height: 24px; flex: none; border: 0; border-radius: 999px; padding: 3px; display: flex; justify-content: flex-end; background: var(--tone); cursor: pointer"><span style="width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); display: block"></span></button></span>
    <span style="display: flex; align-items: center; gap: 8px"><input type="number" aria-label="حد الخسارة اليومي" value="2" dir="ltr" style="width: 90px; min-height: 48px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--bd); background: var(--bg); color: var(--tx); font-family: 'JetBrains Mono', monospace; font-size: 16px"><span style="color: var(--mu)">% من الرصيد</span></span>
    <span style="font-size: 12.5px; line-height: 1.6; color: var(--mu)">تنبيه عند 80% منه، وتنبيه ثانٍ عند بلوغه.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--bd); background: var(--sf)">
    <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-weight: 600">أقصى عدد صفقات</span><button type="button" role="switch" aria-checked="true" aria-label="أقصى عدد صفقات" style="width: 42px; height: 24px; flex: none; border: 0; border-radius: 999px; padding: 3px; display: flex; justify-content: flex-end; background: var(--tone); cursor: pointer"><span style="width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); display: block"></span></button></span>
    <span style="display: flex; align-items: center; gap: 8px"><input type="number" aria-label="أقصى عدد صفقات" value="5" dir="ltr" style="width: 90px; min-height: 48px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--bd); background: var(--bg); color: var(--tx); font-family: 'JetBrains Mono', monospace; font-size: 16px"><span style="color: var(--mu)">صفقات في اليوم</span></span>
    <span style="font-size: 12.5px; line-height: 1.6; color: var(--mu)">رسالة واحدة عند الصفقة التي تتجاوز العدد.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","black"],"default":"dark","section":"المظهر"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var themes = {
      dark: { bg: '#061126', sf: '#0b1c3d', bd: '#1d3466', tx: '#ffffff', mu: '#a9b8d6', pr: '#e6b84a', op: '#0a1a3f', sky: '#5ab8f0' },
      light: { bg: '#f3f5fa', sf: '#ffffff', bd: '#dbe1ee', tx: '#0a1a3f', mu: '#4b5a7d', pr: '#0a1f5c', op: '#f2c14e', sky: '#0369a1' },
      black: { bg: '#000000', sf: '#0a0a0a', bd: '#1f1f1f', tx: '#ffffff', mu: '#9a9a9a', pr: '#f5b83d', op: '#1a1200', sky: '#5ab8f0' }
    };
    var c = themes[this.props.theme] || themes.dark;
    var vars = Object.keys(c).map(function (k) { return '--' + k + ': ' + c[k] + ';'; }).join(' ');
    return { vars: vars };
  }
}
</script>
</body>
</html>
